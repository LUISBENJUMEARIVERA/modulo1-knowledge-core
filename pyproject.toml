[project]
name = "modulo1-knowledge-core"
version = "0.1.0"
description = "Núcleo de Inteligencia y Extracción de Conocimiento de Tecnoquímicas S.A. con LCEL y Web Scraping"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Luis Benjumea", email = "luisantoniobenjumeaia@gmail.com" },
]
keywords = ["llm", "lcel", "langchain", "web-scraping", "tecnoquimicas", "crawler", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "streamlit>=1.66.1",
    "trafilatura>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/LUISBENJUMEARIVERA/scrapping"
Repository = "https://github.com/LUISBENJUMEARIVERA/scrapping"
Issues = "https://github.com/LUISBENJUMEARIVERA/scrapping/issues"

[project.scripts]
modulo1-knowledge-core = "modulo1_knowledge_core:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["chains", "core", "ingestion", "modulo1_knowledge_core"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --tb=short"
