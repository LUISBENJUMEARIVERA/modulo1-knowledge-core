[project]
name = "modulo1-knowledge-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.3",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    "streamlit>=1.66.1",
    "trafilatura>=2.3.1",
]

[project.scripts]
modulo1-knowledge-core = "modulo1_knowledge_core:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
